name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Creates the release and uploads the package.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package
        # music.ini is the editable source of music.reg; the game reads only the .reg.
        run: |
          rm -f res/music.ini
          7z a -r "evil_islands_hq_music_${TAG}.zip" res stream
        env:
          TAG: ${{ github.ref_name }}
      - name: Publish the release
        run: gh release create "$TAG" "evil_islands_hq_music_${TAG}.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
