name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A half-cancelled release is worse than a duplicate one.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Publishes the release on a tag; every other step only reads.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package
        id: package
        run: .github/scripts/build-package.sh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
      # Nightly builds: the zip and the installer themselves, not zipped again; one file per unzipped upload.
      - name: Upload the nightly zip
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error
      - name: Upload the nightly installer
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.exe }}
          archive: false
          if-no-files-found: error
      - name: Publish the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: gh release create "$TAG" "$EXE" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXE: ${{ steps.package.outputs.exe }}
          ZIP: ${{ steps.package.outputs.zip }}
